[package]
name = "lb"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
tokio              = { version = "1",    features = ["full"] }
axum               = "0.7"
reqwest            = { version = "0.12", default-features = false }
prometheus         = "0.13"
lazy_static        = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
